<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
        <title>Expensify - Expense Tracker</title>
</head>
<body>
    <header>
        <h2>Expensify - Expense Tracker</h2>
    </header>

    <div class="container">
        <h4>Your Balance</h4>
        <h1 id="balance">$0.00</h1>


      <div class="inc-exp-container">
        <div>
            <h4>Income</h4>
            <p id="money-plus" class="money plus">+$0.00</p>
        </div> 

        <div>
            <h4>Expense</h4>
            <p id="money-minus" class="money minus ">-$0.00</p>
        </div>
    </div>
    
    <h3>History</h3>
    
        <ul id="list" class="list"></ul>
    <!-- List items -->  
    

    <h3>Add New transition</h3>
    <form id="form">
        <div class="form-contol">
            <label for="text">Name</label>
            <input type="text" id="text" placeholder="Enter name of transaction...">
            </div>

            <div class="form-contol">
            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Enter amount...">
            </div>
           <div class="form-control">
    <label for="category">Category</label>

    <select id="category">
        <option value="Salary">💰 Salary </option>
        <option value="Bonus">🎁 Bonus </option>
        <option value="Food">🍔 Food </option>
        <option value="Interest" data-type="income">🏦 Bank Interest </option>
        <option value="Travel">🚕 Travel </option>
        <option value="Shopping">🛍 Shopping </option>
        <option value="Bills">💡 Bills </option>
        <option value="Entertainment">🎬 Entertainment </option>
        <option value="Other">📦 Other</option>
    </select>
</div>

<div class="form-contol">
    <label>Transaction Type</label>
    <div class="type-option">
        <label>
            <input type="radio" name="type" value="income" checked>
            Income
        </label>

        <label>
            <input type="radio" name="type" value="expense">
            Expense
        </label>
    </div>
</div>

            <button class ="btn">Add transaction</button>
        </form>
    </div>
    <script src="script.js"></script>
    
</body>
</html>
